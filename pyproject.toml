[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-episodic-memory"
version = "1.0.2"
description = "Structured task/outcome log for Autourgos agents — EpisodicMemory."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    {name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com"}
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = ["autourgos", "agent", "memory", "llm", "episodic", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "autourgos-memory>=1.0.6",
    "autourgos-semantic-memory>=2.1.1",
    "autourgos-core>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-episodic-memory"
Repository = "https://github.com/devxjitin/autourgos-episodic-memory"
Issues = "https://github.com/devxjitin/autourgos-episodic-memory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_episodic_memory*"]

[tool.setuptools.package-data]
autourgos_episodic_memory = ["py.typed"]
